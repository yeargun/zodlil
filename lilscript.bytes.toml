[package]
name = "zodlil"
version = "4.4.3"
abi = 1
entry = "src/entry.lil"

[optimization]
preset = "maximum"
call_site_specialization = true

[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "raw"
assume_pristine_builtins = true
strip_console = true
candidate_search = "production"
candidate_limit = 1536
candidate_byte_budget = 1048576
candidate_beam_width = 12

[mangle]
identifiers = true
properties = true
pool_strings = true

[bundle]
mode = "single"
