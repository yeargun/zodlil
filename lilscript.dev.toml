[package]
name = "zodlil"
version = "4.4.3"
abi = 1
entry = "src/entry.lil"

[javascript]
priority = "size-first"
optimization_level = 8
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "off"

[mangle]
identifiers = true
properties = true
pool_strings = true
